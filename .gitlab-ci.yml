# CI for Lidarr.Plugin.YtDlp (Phase 7: native host model).
#
# Target host: Lidarr v3.1.6.5079 (stable). The ext/Lidarr submodule is pinned
# to that tag and supplies the host contract assemblies at compile time
# (Private=false, so host DLLs are never copied into the plugin output).
#
# Pipeline:
#   build   -> Release build: host submodule + plugin, ILRepack merge of CliWrap
#              into Lidarr.Plugin.YtDlp.dll, zip to artifacts/net8.0.zip
#   test    -> full test suite (JUnit report for GitLab)
#   package -> independent verification of the shippable zip (packaging tests)
#   release -> (tags only) publish the zip as a permanent GitLab release asset
#
# The shippable artifact is artifacts/net8.0.zip, which contains exactly one
# entry: Lidarr.Plugin.YtDlp.dll (merged). Manual install location:
#   /var/lib/lidarr/plugins/w200338/lidarr-plugin-ytdlp/Lidarr.Plugin.YtDlp.dll

stages:
  - build
  - test
  - package
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

default:
  image: mcr.microsoft.com/dotnet/sdk:8.0

# Release build. During the plugin project's Release build these targets run:
#   1. CollectHostReferences  - stages host contract DLLs for ILRepack's LibraryPath
#   2. MergePluginDependencies - ILRepack merges CliWrap into Lidarr.Plugin.YtDlp.dll.
#      Host-supplied dependencies (Lidarr.*, NLog, FluentValidation, Newtonsoft.Json)
#      stay EXTERNAL references because the stable host loads its own copies.
#   3. ZipRelease             - stages exactly {Lidarr.Plugin.YtDlp.dll} into
#      artifacts/net8.0.zip (the shippable artifact).
#
# -p:NuGetAudit=false / -p:EnableAnalyzers=false: the host submodule is pinned
# external code that builds with TreatWarningsAsErrors=true. Disabling the audit
# (against the live vulnerability DB) and analyzers keeps the build hermetic
# against upstream database updates and SDK minor-version differences.
#
# -p:AssemblyVersion=1.0.0.0: the host submodule's Directory.Build.props sets
# <AssemblyVersion>10.0.0.*</AssemblyVersion> (its CI replaces it with the
# release version). Building the host references without this override makes
# the plugin reference Lidarr.Core 10.0.0.x, which an installed host
# (v3.1.6.5079) refuses to bind to - both in assembly references and in the
# assembly-qualified names the compiler embeds in custom-attribute blobs
# ([FieldDefinition] enum arguments). 1.0.0.0 is below every released host
# version, so the plugin binds against any host it is installed in.
# (tools/ref-version-rewriter re-stamps assembly references and patches
# attribute blobs as a fallback for builds that miss this flag.)
build:
  stage: build
  script:
    - dotnet build Lidarr.Plugin.YtDlp.sln --configuration Release -v minimal -p:NuGetAudit=false -p:EnableAnalyzers=false -p:AssemblyVersion=1.0.0.0
    - ls -la artifacts/
  artifacts:
    paths:
      # Plugin Release output (the packaging tests inspect it by relative path)
      - Lidarr.Plugin.YtDlp/bin/Release/net8.0/
      # Test project output (lets the test job run --no-build)
      - Lidarr.Plugin.YtDlp.Tests/bin/Release/net8.0/
      # Shippable artifact
      - artifacts/net8.0.zip
    expire_in: 1 week

test:
  stage: test
  script:
    # Absolute LogFileName: JunitXml.TestLogger resolves relative names against
    # the test project directory, which would break the reports/junit path.
    - dotnet test Lidarr.Plugin.YtDlp.Tests/Lidarr.Plugin.YtDlp.Tests.csproj --configuration Release --no-build --logger "junit;LogFileName=$CI_PROJECT_DIR/test-results.xml"
  artifacts:
    when: always
    paths:
      - test-results.xml
    reports:
      junit:
        - test-results.xml
    expire_in: 1 week

# Independent verification of the shippable artifact: re-runs the packaging test
# suite against artifacts/net8.0.zip (zip contents, merged-DLL assembly
# references, host-contract type-leak guards, type-load smoke tests).
package:
  stage: package
  script:
    - dotnet test Lidarr.Plugin.YtDlp.Tests/Lidarr.Plugin.YtDlp.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Packaging" -v minimal
    - ls -la artifacts/net8.0.zip
  needs:
    - job: build
      artifacts: true
    - job: test
      artifacts: false
  artifacts:
    paths:
      - artifacts/net8.0.zip
    expire_in: 1 month

# Tag-triggered release: creates a permanent GitLab release on the tag and
# attaches artifacts/net8.0.zip as a release asset.
#
# Uses the predefined CI_JOB_TOKEN with the JOB-TOKEN header, which GitLab
# permits for creating releases on the current project. If the API call fails
# (older GitLab version or tightened permissions), the job degrades gracefully:
# it prints a manual command and keeps the zip available as a job artifact.
release:
  stage: release
  needs:
    - job: build
      artifacts: true
  script:
    - |
      VERSION="$CI_COMMIT_TAG"
      echo "Publishing release $VERSION to $CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      if curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --request POST \
          --form "tag_name=$VERSION" \
          --form "name=yt-dlp plugin $VERSION" \
          --form "description=Minimum Lidarr Version: 3.1.6.5079

      Native Lidarr plugin: YouTube (yt-dlp) indexer and download client with
      SponsorBlock support.

      Install (manual): unzip into
      /var/lib/lidarr/plugins/w200338/lidarr-plugin-ytdlp/
      so the plugin folder contains Lidarr.Plugin.YtDlp.dll, then restart Lidarr." \
          --form "file=@artifacts/net8.0.zip" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"; then
        echo "Release $VERSION created with artifact net8.0.zip."
      else
        echo "WARNING: release creation failed (check CI_JOB_TOKEN permissions)."
        echo "Run this manually from a machine with GitLab access:"
        echo "  curl --header 'JOB-TOKEN: \$CI_JOB_TOKEN' --request POST \\"
        echo "    --form 'tag_name=$VERSION' \\"
        echo "    --form 'name=yt-dlp plugin $VERSION' \\"
        echo "    --form 'file=@artifacts/net8.0.zip' \\"
        echo "    '$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases'"
        # Keep the pipeline green; the zip is still a job artifact below.
      fi
  artifacts:
    paths:
      - artifacts/net8.0.zip
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG'
