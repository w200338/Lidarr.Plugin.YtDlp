# CI for Lidarr.Plugin.YtDlp — build + tests on push
stages:
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

default:
  image: mcr.microsoft.com/dotnet/sdk:8.0

build:
  stage: build
  script:
    - dotnet restore Lidarr.Plugin.YtDlp.sln
    - dotnet build Lidarr.Plugin.YtDlp.sln --configuration Release --no-restore -v minimal
  artifacts:
    paths:
      - Lidarr.Plugin.YtDlp/bin/Release/net8.0/
    expire_in: 1 week

test:
  stage: test
  script:
    - dotnet test Lidarr.Plugin.YtDlp.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
  artifacts:
    when: always
    paths:
      - "**/*test-results*.trx"
    reports:
      dotnet:
        - "**/*test-results*.trx"
    expire_in: 1 week
